$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: MagicWorks Knowledge & Resource Centre
  structure:
    - type: section
      key: section-1
      title: Home
      path: home
      default: true
      children:
        - type: space
          key: space-1
          title: Home
          path: home
          default: true
          content:
            directory: ./home
    - type: section
      key: section-2
      title: Knowledge Centre
      path: knowledge-centre
      children:
        - type: space
          key: space-2
          title: Knowledge Centre
          path: knowledge-centre
          default: true
          content:
            directory: ./knowledge-centre
    - type: section
      key: section-3
      title: Help Centre
      path: help-centre
      children:
        - type: space
          key: space-3
          title: Help Centre
          path: help-centre
          default: true
          content:
            directory: ./help-centre
    - type: section
      key: section-4
      title: Changelog
      path: changelog
      children:
        - type: space
          key: space-4
          title: Changelog
          path: changelog
          default: true
          content:
            directory: ./changelog
